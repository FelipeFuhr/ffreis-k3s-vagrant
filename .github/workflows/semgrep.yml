name: Security - SAST (Semgrep)

on:
  workflow_dispatch:
  schedule:
    - cron: "9 6 16 * *"  # monthly scattered (was: 0 11 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install semgrep
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "semgrep==1.165.0"

      - name: Run semgrep (SARIF)
        id: semgrep_scan
        run: |
          # set -e is intentionally omitted: we capture the exit code and exit 0
          # so that the SARIF upload step runs even when Semgrep finds issues.
          # Policy enforcement happens in the "Enforce Semgrep policy" step below.
          set -uo pipefail
          mkdir -p semgrep-results
          semgrep scan --config auto --error --sarif --output semgrep-results/semgrep.sarif
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload Semgrep SARIF
        if: ${{ hashFiles('semgrep-results/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results/semgrep.sarif
          category: semgrep

      - name: Enforce Semgrep policy
        run: |
          set -euo pipefail
          rc="${{ steps.semgrep_scan.outputs.rc || '1' }}"
          if [ "${rc}" != "0" ]; then
            echo "Semgrep policy failed with exit code ${rc}" >&2
            exit 1
          fi
