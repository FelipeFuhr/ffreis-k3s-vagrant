name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "5 7 27 * *"  # monthly scattered (was: 20 7 * * 2)
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    permissions:
      id-token: write
      security-events: write
      contents: read
      actions: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard.yml@9d1fde17e23354e2650258481fa6b2a7a6f67e40
    with:
      upload-sarif: true
      publish-results: true
