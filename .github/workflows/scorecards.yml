name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "5 7 27 * *"  # monthly scattered (was: 20 7 * * 2)
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    permissions:
      id-token: write
      security-events: write
      contents: read
      actions: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard-publish.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      upload-sarif: true
