name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "5 7 27 * *"  # monthly scattered (was: 20 7 * * 2)
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    permissions:
      id-token: write
      security-events: write
      contents: read
      actions: read
    uses: ffreis-org/ffreis-workflows-general/.github/workflows/general-scorecard-publish.yml@ef5f76c297dba0d2990210a905d045c826092427 # v1.4.3
    with:
      upload-sarif: true
