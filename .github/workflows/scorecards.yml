name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 2"
  push:
    branches: [main]

jobs:
  scorecard:
    permissions:
      id-token: write
      security-events: write
      contents: read
      actions: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard.yml@b9c2640bf692a05e04dc6456682182bbe331e434
    with:
      upload-sarif: true
      publish-results: true
