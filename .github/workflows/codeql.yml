name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    - cron: "34 11 14 * *"  # monthly scattered (was: 0 0 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ffreis-org/ffreis-workflows-general/.github/workflows/general-codeql.yml@ef5f76c297dba0d2990210a905d045c826092427
    with:
      languages: "python"
